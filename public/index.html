<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rail</title>
<style>
  :root { --bg:#0d0f12; --panel:#16191e; --panel2:#1e2229; --line:#2c313a;
          --text:#d6dce5; --muted:#808996; --accent:#58a6ff; --good:#4ad58c; --bad:#f0766a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:13px/1.4 "Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:10px; padding:9px 14px;
    border-bottom:1px solid var(--line); background:var(--panel); }
  header b { font-size:15px; letter-spacing:.5px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#5a606c; }
  .dot.on { background:var(--good); }
  .grow { flex:1; }
  .muted { color:var(--muted); }
  input, select { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:5px 8px; font:12px "Segoe UI",sans-serif; outline:none; }
  input:focus { border-color:#3a6ea5; }
  button { background:#22262e; color:var(--text); border:1px solid #343a45; border-radius:6px;
    padding:6px 10px; font:12px "Segoe UI",sans-serif; cursor:pointer; }
  button:hover { background:#2b313a; }
  button.accent { background:#224e8a; border-color:#3a6ea5; color:#fff; }
  button.danger { background:#4a2c2c; border-color:#7a4642; color:#ffc4be; }
  main { flex:1; display:flex; min-height:0; }
  #view { flex:1; position:relative; background:#060709; min-width:0; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #idle { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); flex-direction:column; gap:6px; pointer-events:none; }
  aside { width:340px; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; }
  aside > div { padding:9px 12px; }
  .sec { border-bottom:1px solid var(--line); }
  .cap { font-size:11px; letter-spacing:1px; color:#70c2a4; margin-bottom:6px; }
  #devices { max-height:140px; overflow:auto; }
  .dev { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px;
    cursor:pointer; border:1px solid transparent; }
  .dev:hover { background:#1c2027; }
  .dev.sel { background:#22456f; border-color:#3a6ea5; }
  .dev .d { width:8px; height:8px; border-radius:50%; background:var(--good); }
  .dev .n { font-size:12px; } .dev .s { font-size:11px; color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .row:last-child { margin-bottom:0; }
  label { font-size:11px; color:var(--muted); }
  #log { flex:1; overflow:auto; font:11px/1.35 Consolas,monospace; border:1px solid var(--line);
    border-radius:6px; background:#14171c; min-height:80px; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:2px 6px; border-bottom:1px solid #1d2127; text-align:left; vertical-align:top; }
  td.t { color:#8ea3bd; white-space:nowrap; } td.w { color:#6f7a8a; max-width:92px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #login { position:fixed; inset:0; background:#0b0d10; display:flex; align-items:center;
    justify-content:center; z-index:50; }
  #login .box { background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:24px; width:320px; display:flex; flex-direction:column; gap:10px; }
  #login h1 { margin:0 0 6px; font-size:18px; }
  #admin { position:fixed; inset:0; background:#0b0d10ee; z-index:40; display:none; padding:24px; }
  #admin .wrap { max-width:1100px; margin:0 auto; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:18px; max-height:100%; overflow:auto; }
  #admin h2 { margin:0 0 12px; font-size:15px; color:#70c2a4; }
  #admin .cols { display:flex; gap:18px; flex-wrap:wrap; }
  #admin .col { flex:1; min-width:300px; }
  #admin table { font-size:12px; }
  #admin td button { padding:2px 6px; font-size:11px; }
  .ok { color:var(--good); } .bad { color:var(--bad); }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#224e8a; color:#fff; padding:8px 14px; border-radius:8px; display:none; z-index:60; }
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h1>rail</h1>
    <input id="lu" placeholder="benutzer" autocomplete="username">
    <input id="lp" type="password" placeholder="passwort" autocomplete="current-password">
    <button id="lbtn" class="accent">anmelden</button>
    <div id="lerr" class="bad" style="font-size:12px"></div>
  </div>
</div>

<div id="app">
  <header>
    <b>rail</b>
    <span id="st" class="dot"></span>
    <span id="who" class="muted">—</span>
    <span class="grow"></span>
    <span id="stats" class="muted"></span>
    <span id="me" class="muted"></span>
    <button id="adminBtn" style="display:none">admin</button>
    <button id="out">logout</button>
  </header>
  <main>
    <div id="view">
      <canvas id="cv"></canvas>
      <div id="idle"><div>no signal</div><div class="muted" style="font-size:11px">gerät wählen</div></div>
    </div>
    <aside>
      <div class="sec">
        <div class="cap">GERÄTE <span id="dcount" class="muted" style="float:right"></span></div>
        <div id="devices"><div class="muted" style="font-size:11px">keine</div></div>
      </div>
      <div class="sec">
        <div class="cap">SCREEN</div>
        <div class="row"><select id="mon" style="flex:1"></select><button id="scan">scan</button></div>
        <div class="row"><label style="width:44px">quality</label>
          <input id="q" type="range" min="10" max="95" value="55" style="flex:1">
          <span id="qv" style="width:22px;text-align:right">55</span></div>
        <div class="row">
          <select id="fps"><option>5</option><option>8</option><option selected>10</option>
            <option>15</option><option>20</option><option>25</option><option>30</option></select>
          <select id="scale"><option>100 %</option><option>75 %</option><option>50 %</option><option>35 %</option></select>
        </div>
        <div class="row"><button id="live" class="accent" style="flex:1">▶ live</button><button id="rel">release</button></div>
        <div class="row"><label><input id="ctl" type="checkbox"> control — klick und tipp im bild</label></div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; min-height:0; padding:9px 12px;">
        <div class="cap">LOG</div>
        <div class="row"><input id="q2" style="flex:1" placeholder="w:fenster  t:text"><button id="query" class="accent">query</button></div>
        <div class="row"><button id="export" style="flex:1">alles exportieren</button></div>
        <div class="row"><button id="clear" style="flex:1">log leeren</button></div>
        <div class="row"><button id="wipe" class="danger" style="flex:1">self destroy</button></div>
        <div class="row"><span id="lcount" class="muted" style="font-size:11px">—</span></div>
        <div id="log"><table><tbody id="rows"></tbody></table></div>
      </div>
    </aside>
  </main>
</div>

<div id="admin">
  <div class="wrap">
    <div style="display:flex;align-items:center;gap:10px">
      <h2 style="flex:1;margin:0">ADMIN</h2>
      <button id="adminClose">schließen</button>
    </div>
    <div class="cols" style="margin-top:14px">
      <div class="col">
        <div class="cap">ACCOUNTS</div>
        <table><thead><tr><th>user</th><th>rolle</th><th></th></tr></thead><tbody id="urows"></tbody></table>
        <div class="row" style="margin-top:10px">
          <input id="nu" placeholder="benutzer" style="width:110px">
          <input id="np" placeholder="passwort" style="width:110px">
          <select id="nr"><option>viewer</option><option>operator</option><option>admin</option></select>
          <button id="nadd" class="accent">anlegen</button>
        </div>
      </div>
      <div class="col">
        <div class="cap">LIVE</div>
        <table><thead><tr><th>user</th><th>seit</th><th>ip</th><th></th></tr></thead><tbody id="srows"></tbody></table>
      </div>
    </div>
    <div style="margin-top:18px">
      <div class="cap">AKTIVITÄT</div>
      <div id="audit" style="max-height:260px;overflow:auto;font:11px/1.4 Consolas,monospace"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
